<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Internship Platform</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header><div class="brand">InternshipHub</div><div id="userBox"></div></header>
<main>
<section class="hero">
<h1>Find your next internship.</h1>
<p>Real internship workflow with deadlines, applications, role-based access and email notifications.</p>
</section>
<div id="toast"></div>
<section id="auth" class="grid two">
<div class="card"><h2>Login</h2>
<form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button>Login</button></form>
</div>
<div class="card"><h2>Register</h2>
<form id="registerForm"><input id="regName" placeholder="Full name" required><input id="regEmail" type="email" placeholder="Email" required><input id="regPassword" type="password" placeholder="Password" required><select id="regRole"><option value="student">Student</option><option value="company">Company</option></select><button>Register</button></form>
</div>
</section>
<section id="appArea" hidden>
<div class="toolbar"><h2>Internships</h2><button class="secondary" onclick="loadInternships()">Refresh</button><button class="danger" onclick="logout()">Logout</button></div>
<div id="companyPanel" class="card" hidden><h3>Create Internship</h3><form id="internshipForm"><input id="intTitle" placeholder="Title" required><textarea id="intDescription" placeholder="Description" required></textarea><label>Application deadline</label><input id="intDeadline" type="datetime-local" required><button>Create Posting</button></form></div>
<div id="internships" class="grid"></div>
<div id="myApplications" class="card" hidden><h3>My Applications</h3><div id="mine"></div></div>
<div id="companyApplications" class="card" hidden><h3>Applications Received</h3><div id="received"></div></div>
</section>
</main>
<script src="/js/app.js"></script>
</body></html>
